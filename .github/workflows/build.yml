  android:
    name: Android app (.apk)
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --org com.solo --project-name solo_vd --platforms=android .
          rm -rf test
          cp platform_overrides/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          K=android/app/src/main/kotlin/com/solo/solo_vd
          mkdir -p $K
          cp platform_overrides/android/MainActivity.kt $K/MainActivity.kt
          cp platform_overrides/android/DownloadService.kt $K/DownloadService.kt
          cp -r platform_overrides/android/res/. android/app/src/main/res/
          cp platform_overrides/android/signing/solo.jks android/app/solo.jks
          J=android/app/src/main/jniLibs
          mkdir -p $J/arm64-v8a $J/armeabi-v7a
          curl -fsSL -o $J/arm64-v8a/libqjs.so https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-aarch64
          curl -fsSL -o $J/armeabi-v7a/libqjs.so https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-armv7
          chmod +x $J/*/libqjs.so
          file $J/*/libqjs.so || true
          if [ ! -f android/app/build.gradle.kts ]; then echo "build.gradle.kts not found"; ls android/app; exit 1; fi
          cat platform_overrides/android/app_gradle_extra.kts >> android/app/build.gradle.kts
          flutter pub get
          # flutter_inappwebview_android 1.1.x uses a ProGuard file new Android Gradle no longer accepts
          for f in ${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$f" && echo "patched $f"
          done
      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SoloVideoDownloader-Android-$APP_VERSION.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoloVD-Android
          path: dist/*.apk

  windows:
    name: Windows installer (.exe)
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Windows project
        shell: pwsh
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) { choco install nuget.commandline -y --no-progress }
          flutter create --org com.solo --project-name solo_vd --platforms=windows .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"solo_vd"', 'L"Solo Video Downloader"' | Set-Content $f
          $rc = "windows/runner/Runner.rc"
          (Get-Content $rc) -replace '"solo_vd"', '"Solo Video Downloader"' | Set-Content $rc
          Copy-Item platform_overrides/windows/app_icon.ico windows/runner/resources/app_icon.ico -Force
          flutter pub get
      - name: Build EXE
        env:
          # new Visual Studio rejects the old coroutine header the WebView plugin uses unless told it's ok
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - name: Add download engine (yt-dlp + ffmpeg + deno)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $bin = "build/windows/x64/runner/Release/bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$bin/yt-dlp.exe"
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff -Force
          Get-ChildItem ff -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination $bin
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath $bin -Force
          & "$bin/yt-dlp.exe" --version
          & "$bin/deno.exe" --version
          & "$bin/ffmpeg.exe" -version | Select-Object -First 1
          Get-ChildItem $bin | Format-Table Name, Length
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:APP_VERSION" installer\solovd.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoloVD-Windows
          path: dist/*

  release:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SoloVD-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Solo Video Downloader v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows: SoloVideoDownloader-Setup-${{ env.APP_VERSION }}.exe download panni install pannunga.
            Android: SoloVideoDownloader-Android-${{ env.APP_VERSION }}.apk download panni install pannunga.
          files: dist/*
